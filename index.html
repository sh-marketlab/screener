<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>白8藍12篩選儀表板</title>
<style>
/* 版面：上方摘要與篩選，下方一張可展開的表格 */
:root{--bg:#f6f7f9;--panel:#fff;--ink:#1b2430;--mute:#5a6675;--line:#d9dee6;--accent:#3b4cb8;
  --ok:#1f7a4d;--ok-bg:#e3f4ea;--flag:#8a6412;--flag-bg:#fff3d1;--veto:#a8321f;--veto-bg:#fbe5e0;--na:#56616f;--na-bg:#eceff3;
  --white-team:#6b7685;--blue-team:#1f6fb5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12161c;--panel:#1a2029;--ink:#e6eaf0;--mute:#9aa6b5;--line:#2e3744;--accent:#9aa6f2;
  --ok:#7fd3a4;--ok-bg:#173826;--flag:#f0d88a;--flag-bg:#3a3115;--veto:#f0957b;--veto-bg:#47241b;--na:#aab4c2;--na-bg:#262d38;--white-team:#b4bdc9;--blue-team:#6db3ee}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12161c;--panel:#1a2029;--ink:#e6eaf0;--mute:#9aa6b5;--line:#2e3744;--accent:#9aa6f2;
  --ok:#7fd3a4;--ok-bg:#173826;--flag:#f0d88a;--flag-bg:#3a3115;--veto:#f0957b;--veto-bg:#47241b;--na:#aab4c2;--na-bg:#262d38;--white-team:#b4bdc9;--blue-team:#6db3ee}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:15px;line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 60px}
header{padding:28px 0 8px;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline;justify-content:space-between}
h1{font-size:24px;margin:0}
header a{color:var(--accent)}
.meta{color:var(--mute);font-size:13.5px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.tile b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.tile span{color:var(--mute);font-size:13px}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.filters label{font-size:13px;color:var(--mute);display:flex;flex-direction:column;gap:2px}
select,input{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
select:focus-visible,input:focus-visible,tr.row:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tw{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:13px;color:var(--mute);padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--na-bg)}
.chip{display:inline-block;border-radius:4px;padding:0 7px;font-size:12.5px;white-space:nowrap}
.pass{background:var(--ok-bg);color:var(--ok)}.flag,.pending{background:var(--flag-bg);color:var(--flag)}
.veto{background:var(--veto-bg);color:var(--veto)}.insufficient,.none,.missing{background:var(--na-bg);color:var(--na)}
.w{color:var(--white-team);font-weight:700}.b{color:var(--blue-team);font-weight:700}
.detail td{background:var(--bg);font-size:13.5px}
.detail table{width:auto;min-width:60%}
.detail th,.detail td{padding:4px 10px;border-bottom:1px solid var(--line)}
.small{color:var(--mute);font-size:13px}
h2{font-size:17px;margin:22px 0 8px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
h2 select{font-size:13px}
.port{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.card h3{margin:0 0 6px;font-size:15px}
.card table td{padding:5px 6px;font-size:13.5px}
.card table td:last-child{text-align:right;white-space:nowrap}
.empty{padding:24px;text-align:center;color:var(--mute)}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>白8藍12篩選儀表板</h1>
  <div class="meta"><span id="meta">讀取中</span> · <a href="rules.html">規則手冊</a></div>
</header>
<div class="tiles" id="tiles"></div>
<h2>組合檢查 <select id="p-scope" aria-label="組合檢查範圍"><option value="seat">只算席位</option><option value="watch">席位＋觀察名單</option></select></h2>
<div class="port" id="port"></div>
<p class="small">上限來自 universe.json 的 rules.caps。資金占比類的上限需要部位金額，這裡沒有計算。</p>
<h2>候選名單</h2>
<div class="filters">
  <label>隊別<select id="f-team"><option value="">全部</option><option value="white">白隊（守）</option><option value="blue">藍隊（攻）</option></select></label>
  <label>狀態<select id="f-stage"><option value="">全部（不含停用）</option><option value="seat">席位</option><option value="watch">觀察名單</option><option value="pool">候選池</option><option value="disabled">停用</option></select></label>
  <label>板塊<select id="f-sector"><option value="">全部</option></select></label>
  <label>否決欄<select id="f-verdict"><option value="">全部</option><option value="pass">通過</option><option value="flag">注意</option><option value="veto">否決</option><option value="insufficient">資料不足</option><option value="none">尚未抓取</option></select></label>
  <label>搜尋<input id="f-q" type="search" placeholder="代碼或名稱"></label>
</div>
<div class="tw"><table>
<thead><tr><th>代碼</th><th>名稱</th><th>板塊</th><th>隊別</th><th>狀態</th><th>題材驗證</th><th>主標籤</th><th>否決欄</th><th>總分</th><th>三角</th><th>4 指標</th><th>自由現金流</th><th>槓桿</th><th>利息保障</th><th>股數年增</th><th>來源</th></tr></thead>
<tbody id="rows"></tbody></table><div class="empty" id="empty" hidden>沒有符合條件的標的</div></div>
<p class="small">點任一列可以看各項檢查的明細。財務數字是近四季合計，抓不到季報時用最近年度。總分要有 20 項分數才算得出來，目前用的是代理版。否決欄只做了能自動計算的項目，潛在稀釋、近 2 年到期負債、最大客戶占比要人工補。本頁不是投資建議。</p>
</div>
<script>
const L={stage:{seat:"席位",watch:"觀察名單",pool:"候選池",disabled:"停用"},
  verdict:{pass:"通過",flag:"注意",veto:"否決",insufficient:"資料不足",none:"尚未抓取",pending:"待補規則",missing:"缺資料"},
  ver:{verified:"已驗證",partial:"部分",unverified:"未驗證",warning:"警告",unreviewed:"未審查"}};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=v=>v==null?"—":(Math.abs(v)>=1e9?(v/1e9).toFixed(1)+"B":(v/1e6).toFixed(0)+"M");
const num=(v,d=1)=>v==null?"—":v.toFixed(d);
const pct=v=>v==null?"—":(v*100).toFixed(1)+"%";
const cur=t=>{const c=((t.m||{}).market||{}).financial_currency;return c&&c!=="USD"&&((t.m||{}).metrics||{}).fcf!=null?` <span class="small">${esc(c)}</span>`:"";};
const chip=(k,t)=>`<span class="chip ${k}">${esc(t)}</span>`;
let U,M={},open=new Set();
async function load(){
  U=await (await fetch("universe.json",{cache:"no-store"})).json();
  try{const r=await fetch("data/metrics.json",{cache:"no-store"});if(r.ok)M=await r.json();}catch(e){}
  const sec=document.getElementById("f-sector");
  U.sectors.filter(s=>s.active).forEach(s=>sec.insertAdjacentHTML("beforeend",`<option value="${esc(s.id)}">${esc(s.name)}</option>`));
  document.getElementById("meta").textContent=`名單更新 ${U.updated}`+(M.generated?` · 財務資料 ${M.generated}`:" · 財務資料尚未抓取");
  document.querySelectorAll(".filters select,.filters input,#p-scope").forEach(e=>e.addEventListener("input",render));
  render();
}
const SL={roe:"ROE",debt_to_equity:"負債權益比",interest_coverage:"利息保障倍數",fcf_to_capex:"自由現金流 ÷ 資本支出",net_debt_to_fcf:"含租賃淨負債 ÷ 自由現金流（年）",top_customer:"最大客戶占比",capex_trend:"資本支出 ÷ 營收的 3 年變化"};
const SP=new Set(["roe","top_customer","capex_trend"]);
function scoreCells(t){const s=(t.m||{}).score;if(!s)return "<td>—</td><td>—</td><td>—</td>";
  const tot=s.total==null?`<span class="small">${s.score20==null?"缺 20 項":"資料不足"}</span>`:chip(s.passed?"pass":"flag",s.total.toFixed(1));
  return `<td>${tot}</td><td>${s.triangle_points}/${s.triangle_items}</td><td>${s.indicator_points}/${s.indicator_items}</td>`;}
function scoreDetail(t){const s=(t.m||{}).score;if(!s)return "";
  const row=(k,x)=>`<tr><td>${SL[k]}</td><td>${x.value==null?"—":SP.has(k)?pct(x.value):num(x.value,2)}</td><td>${x.points==null?"—":x.points}</td><td class="small">${esc(x.note||"")}</td></tr>`;
  const rows=o=>Object.entries(o).map(([k,x])=>row(k,x)).join("");
  return `<table><tr><th>評分項目</th><th>數值</th><th>得分</th><th>備註</th></tr>${rows(s.triangle)}${rows(s.indicators)}
    <tr><td>20 項（代理版）</td><td>${s.score20??"—"}</td><td></td><td class="small">${s.total==null?"":"總分 "+s.total.toFixed(1)+"，門檻 "+U.rules.pass_score}</td></tr></table>`;}
function portfolio(all){
  const scope=val("p-scope"),caps=U.rules.caps,mt=M.tickers||{};
  const stages=scope==="seat"?["seat"]:["seat","watch"];
  const line=(label,value,ok,warn)=>`<tr><td>${label}</td><td>${value}</td><td>${ok==null?"":chip(ok?"pass":(warn?"flag":"veto"),ok?"符合":(warn?"留意":"超過"))}</td></tr>`;
  document.getElementById("port").innerHTML=["white","blue"].map(team=>{
    const mem=all.filter(t=>t.team===team&&stages.includes(t.stage));
    const seats=team==="white"?U.rules.white_seats:U.rules.blue_seats;
    const by={};mem.forEach(t=>(by[t.tags.primary]??=[]).push(t.ticker));
    const cap=team==="white"?caps.white_same_primary:caps.blue_same_primary;
    const tagRows=Object.entries(by).sort((a,b)=>b[1].length-a[1].length).map(([g,l])=>line(`主標籤：${esc(U.factor_tags[g])}`,`${l.length} 席（上限 ${cap}）<br><span class="small">${l.join("、")}</span>`,l.length<=cap)).join("");
    const ai=mem.filter(t=>t.tags.primary==="ai_capex"||t.tags.secondary.includes("ai_capex")).map(t=>t.ticker);
    const fw=(by.funding_window||[]).length,fwCap=team==="white"?caps.white_funding_window:caps.blue_funding_window;
    const kinds=Object.keys(by).length;
    const vetoed=mem.filter(t=>t.v==="veto").map(t=>t.ticker);
    const hiBeta=team==="white"?mem.filter(t=>{const b=((mt[t.ticker]||{}).market||{}).beta;return b==null||b>=1;}).map(t=>t.ticker+"（"+(((mt[t.ticker]||{}).market||{}).beta?.toFixed(2)??"無資料")+"）"):[];
    const scored=mem.filter(t=>((t.m||{}).score||{}).total!=null),below=scored.filter(t=>!t.m.score.passed).map(t=>t.ticker);
    return `<div class="card"><h3 class="${team==="white"?"w":"b"}">${team==="white"?"白隊（守）":"藍隊（攻）"}</h3><table>
      ${line("納入計算的檔數",`${mem.length} ／ ${seats} 席`,mem.length<=seats,true)}
      ${mem.length?tagRows:""}
      ${team==="white"?line("帶 AI 標籤（主或副）",`${ai.length} 席（上限 ${caps.white_ai_tag}）<br><span class="small">${ai.join("、")||"無"}</span>`,ai.length<=caps.white_ai_tag):""}
      ${line("融資視窗",`${fw} 席（上限 ${fwCap}）`,fw<=fwCap)}
      ${mem.length>=4?line("主標籤種類",`${kinds} 種（至少 4 種）`,kinds>=4):""}
      ${team==="white"&&mem.length?line("Beta 低於 1",hiBeta.length?`不符合：<span class="small">${hiBeta.join("、")}</span>`:"全部符合",hiBeta.length===0):""}
      ${mem.length?line("否決欄未過",vetoed.length?vetoed.join("、"):"無",vetoed.length===0):""}
      ${mem.length?line("總分低於門檻",`${below.join("、")||"無"}<br><span class="small">${scored.length}／${mem.length} 檔有總分</span>`,below.length===0,true):""}
    </table></div>`;}).join("");
}
function fmtVal(c){const v=c.value;if(v==null)return "—";
  return /倍數|年）|倍）|Altman|跑道|EBITDA ÷/.test(c.label)?num(v,2):pct(v);}
function render(){
  const f={team:val("f-team"),stage:val("f-stage"),sector:val("f-sector"),verdict:val("f-verdict"),q:val("f-q").trim().toLowerCase()};
  const sname=Object.fromEntries(U.sectors.map(s=>[s.id,s.name]));
  const mt=M.tickers||{};
  const all=U.tickers.map(t=>({...t,m:mt[t.ticker],v:(mt[t.ticker]||{}).verdict||"none"}));
  const live=all.filter(t=>t.stage!=="disabled");
  const cnt=(arr,fn)=>arr.filter(fn).length;
  document.getElementById("tiles").innerHTML=[
    ["候選總數",live.length],["白隊席位",cnt(live,t=>t.team==="white"&&t.stage==="seat")+" / "+U.rules.white_seats],
    ["藍隊席位",cnt(live,t=>t.team==="blue"&&t.stage==="seat")+" / "+U.rules.blue_seats],
    ["否決",cnt(live,t=>t.v==="veto")],["注意",cnt(live,t=>t.v==="flag")],["通過",cnt(live,t=>t.v==="pass")]
  ].map(([k,n])=>`<div class="tile"><b>${n}</b><span>${k}</span></div>`).join("");
  portfolio(all);
  const rows=all.filter(t=>(f.stage?t.stage===f.stage:t.stage!=="disabled")&&(!f.team||t.team===f.team)&&(!f.sector||t.sector===f.sector)
    &&(!f.verdict||t.v===f.verdict)&&(!f.q||(t.ticker+" "+t.name).toLowerCase().includes(f.q)));
  document.getElementById("empty").hidden=rows.length>0;
  document.getElementById("rows").innerHTML=rows.map(t=>{
    const m=(t.m||{}).metrics||{};
    let h=`<tr class="row" tabindex="0" data-t="${esc(t.ticker)}"><td><b>${esc(t.ticker)}</b></td><td>${esc(t.name)}</td><td>${esc(sname[t.sector])}</td>
      <td class="${t.team==="white"?"w":"b"}">${t.team==="white"?"白":"藍"}</td><td>${L.stage[t.stage]}</td>
      <td>${esc(L.ver[t.verification.status])}</td><td>${esc(U.factor_tags[t.tags.primary])}</td><td>${chip(t.v,L.verdict[t.v])}</td>${scoreCells(t)}
      <td>${money(m.fcf)}${cur(t)}</td><td>${m.net_debt_to_ebitda!=null?num(m.net_debt_to_ebitda)+' <span class="small">倍 EBITDA</span>':m.net_debt_to_fcf!=null?num(m.net_debt_to_fcf)+' <span class="small">年 FCF</span>':'—'}</td><td>${num(m.interest_coverage)}</td><td>${pct(m.share_growth)}</td><td>${esc((t.m||{}).source||"—")}</td></tr>`;
    if(open.has(t.ticker)){
      const checks=((t.m||{}).checks||[]).map(c=>`<tr><td>${esc(c.label)}</td><td>${fmtVal(c)}</td><td>${chip(c.result,L.verdict[c.result]||c.result)}</td></tr>`).join("");
      const cc=((t.m||{}).crosscheck||[]).map(c=>`${esc(c.field)} 差 ${pct(c.diff)}`).join("、");
      const err=((t.m||{}).errors||[]).join("；");
      h+=`<tr class="detail"><td colspan="16">
        <div><b>題材：</b>${esc(t.theme)}　<b>備註：</b>${esc(t.verification.note)}</div>
        <div><b>必需性：</b>${esc(t.role.essential)}　<b>瓶頸性：</b>${esc(t.role.bottleneck)}　<b>副標籤：</b>${t.tags.secondary.concat(t.tags.personal).map(x=>esc(U.factor_tags[x])).join("、")||"無"}</div>
        ${t.disabled_reason?`<div><b>停用原因：</b>${esc(t.disabled_reason)}</div>`:""}
        ${checks?`<table><tr><th>檢查</th><th>數值</th><th>結果</th></tr>${checks}</table>`:`<div class="small">還沒有財務資料</div>`}
        ${scoreDetail(t)}${(t.m||{}).fiscal_end?`<div class="small">資料期間：${esc(t.m.basis||"")}，截至 ${esc(t.m.fiscal_end)}${t.m.yahoo_filled&&t.m.yahoo_filled.length?"；Yahoo 補的欄位："+esc(t.m.yahoo_filled.join("、")):""}</div>`:""}
        ${cc?`<div class="small">SEC 與 Yahoo 差距超過 5%：${cc}</div>`:""}${err?`<div class="small">抓取錯誤：${esc(err)}</div>`:""}</td></tr>`;
    }
    return h;}).join("");
}
const val=id=>document.getElementById(id).value;
function toggle(e){const tr=e.target.closest("tr.row");if(!tr)return;const t=tr.dataset.t;open.has(t)?open.delete(t):open.add(t);render();}
document.getElementById("rows").addEventListener("click",toggle);
document.getElementById("rows").addEventListener("keydown",e=>{if(e.key==="Enter")toggle(e);});
load().catch(e=>{document.getElementById("meta").textContent="讀取失敗："+e.message;});
</script>
</body>
</html>
