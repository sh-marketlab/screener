name: 信用追蹤

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 6"   # 每週六 03:23 UTC（台灣時間週六 11:23），抓週五收盤

permissions:
  contents: write

concurrency:
  group: commit-data
  cancel-in-progress: false

jobs:
  credit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/test_credit.py
      - run: python scripts/fetch_credit.py
      - name: 提交結果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/credit.json data/credit_history.json
          git diff --cached --quiet || git commit -m "更新信用追蹤"
          git pull --rebase
          git push
